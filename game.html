function portrait(kind,mood=0){const [name,skin,hair,shirt,k]=GUESTS[kind%GUESTS.length];return `<svg viewBox="0 0 100 110" aria-hidden="true"><path d="M12 110V95q2-24 38-24t38 24v15" fill="${shirt}"/><path d="M39 66h22v20H39" fill="${skin}"/><ellipse cx="50" cy="42" rx="30" ry="34" fill="${hair}"/><ellipse cx="50" cy="47" rx="24" ry="28" fill="${skin}"/><path d="M25 36q-3-28 25-28q32 0 29 29q-18-3-26-19q-3 14-28 18" fill="${hair}"/>${mood>=2?'<path d="M28 39q22-7 44 0v14q-24-5-44 0Z" fill="#542b35" opacity=".22"/><ellipse cx="32" cy="55" rx="5" ry="3" fill="#d2614e" opacity=".5"/><ellipse cx="68" cy="55" rx="5" ry="3" fill="#d2614e" opacity=".5"/>':''}<circle cx="41" cy="45" r="2"/><circle cx="60" cy="45" r="2"/><path d="${['M35 36q6-3 12 0M54 36q6-3 12 0','M35 36l12 3M54 39l12-3','M34 33l14 7M53 40l14-7','M33 31l15 10M53 41l15-10'][mood]}" stroke="#49342c" stroke-width="${mood>=2?3:2}" fill="none"/><path d="${['M42 58q9 9 18 0','M43 62h15','M42 64q9-8 18 0','M40 65q10-13 20 0Z'][mood]}" stroke="#643e30" stroke-width="2.5" fill="${mood===3?'#663427':'none'}"/>${mood===3?'<path d="M74 32l5 1l-1 5m-2-10l1-5l5 1m-1 13l5 1l1-5" stroke="#bb3f30" stroke-width="2.5" fill="none"/>':''}${k%3===1?'<g fill="none" stroke="#423a34" stroke-width="2"><rect x="30" y="39" width="17" height="12" rx="4"/><rect x="54" y="39" width="17" height="12" rx="4"/><path d="M47 43h7"/></g>':''}${k===3?'<path d="M21 29Q13-4 50 3q33 0 30 26Z" fill="#648383"/><path d="M16 29h68" stroke="#385d60" stroke-width="6"/>':''}${k===2?'<path d="M26 34L19 88l16-8V43m42-9l5 54l-16-8V43" fill="'+hair+'"/>':''}</svg>`}
const PATIENCE_MS=20000,MAX_GUESTS=15;
function guestMood(o){const age=Date.now()-o.arrived;return o.angry?3:o.departAt?0:age<8000?0:age<14000?1:age<18000?2:3}
function newGuest(g,now=Date.now()){if(g.nextId>MAX_GUESTS)return null;const id=g.nextId++;return {id,kind:randomInt(GUESTS.length),ice:!!randomInt(2),sauce:!!randomInt(2),arrived:now,departAt:null,angry:false}}
function blankMeal(g){g.stage='raw';g.cookAt=null;g.stopProgress=0;g.sauce=0;g.drink=null;g.packed=null;g.onHeat=false;g.fireAlert=false;g.fireShown=false}
if(W.fish.current?.schema!==3){W.fish.current=null;saveGame()}
if(W.fish.current&&W.fish.current.onHeat===undefined){W.fish.current.onHeat=W.fish.current.stage==='cooking';W.fish.current.fireAlert=false;W.fish.current.fireShown=false;saveGame()}
function fishUpdate(){const g=W.fish.current;if(g?.status!=='playing')return false;const now=Date.now();let changed=false;if(now>=g.deadline){g.status=g.served>=GOAL?'won':'lost';saveGame();return true}if(g.onHeat&&(now-g.cookAt)/COOK_MS>GOOD_MAX&&g.stage==='cooking'){g.stage='burnt';changed=true}if(g.onHeat&&(now-g.cookAt)>=COOK_MS&&!g.fireShown){g.stopProgress=1;g.onHeat=false;g.fireShown=true;g.fireAlert=true;changed=true}for(let i=0;i<g.waiting.length;i++){const o=g.waiting[i];if(!o.departAt&&now-o.arrived>=PATIENCE_MS){o.angry=true;o.departAt=now+650;g.angryLeft=(g.angryLeft||0)+1;changed=true}if(o.departAt&&now>=o.departAt){g.waiting[i]=newGuest(g,now);changed=true}}g.waiting=g.waiting.filter(Boolean);if(!g.waiting.length&&g.nextId>MAX_GUESTS){g.status=g.served>=GOAL?'won':'lost';changed=true}if(!g.waiting.some(o=>o.id===g.target&&!o.departAt)){const next=g.waiting.find(o=>!o.departAt)?.id??null;if(g.target!==next){g.target=next;changed=true}}if(changed)saveGame();return changed}
async function startFish(){await gameAction(()=>{if(W.fish.current?.status==='playing')return;const rewardEligible=useRewardChance('fish');const g={rewardEligible,schema:3,id:uid(),status:'playing',deadline:Date.now()+60000,nextId:1,waiting:[],target:null,served:0,delivered:0,angryLeft:0,awarded:false};g.waiting=[newGuest(g),newGuest(g)];g.target=g.waiting[0].id;blankMeal(g);W.fish.current=g});document.querySelector('.fish-game')?.scrollIntoView({block:'start',behavior:'smooth'})}
function selectCustomer(id){return gameAction(()=>{fishUpdate();const g=W.fish.current;if(g?.status==='playing'&&g.waiting.some(o=>o.id===id&&!o.departAt))g.target=id})}
function fishAction(action){return gameAction(()=>{const intendedTarget=W.fish.current?.target;fishUpdate();const g=W.fish.current;if(g?.status!=='playing'||(g.fireAlert&&action!=='discard'))return;const now=Date.now();if(action==='grill'&&g.stage==='raw'){g.stage='cooking';g.cookAt=now;g.stopProgress=0;g.onHeat=true;g.fireShown=false}else if(action==='plate'&&g.stage==='cooking'){const p=(now-g.cookAt)/COOK_MS;g.onHeat=false;g.stopProgress=Math.min(1,p);g.stage=p<GOOD_MIN?'undercooked':p>GOOD_MAX?'burnt':'plate'}else if(action==='sauce'&&g.stage==='plate'&&!g.packed){g.sauce=Math.min(2,g.sauce+1)}else if(action==='drink'&&!g.packed){g.drink={ice:false}}else if(action==='ice'&&g.drink&&!g.packed){g.drink.ice=!g.drink.ice}else if(action==='discard'){blankMeal(g)}else if(action==='pack'&&g.stage==='plate'&&g.drink&&!g.packed){g.packed={sauce:g.sauce,ice:g.drink.ice}}else if(action==='unpack'&&g.packed){g.packed=null}else if(action==='serve'&&g.packed){const o=g.waiting.find(o=>o.id===intendedTarget&&!o.departAt);if(!o)return;const correct=(o.sauce?g.packed.sauce===2:g.packed.sauce===0)&&o.ice===g.packed.ice;o.departAt=now+650;g.delivered++;if(correct)g.served++;if(g.served>=GOAL&&g.rewardEligible!==false&&!g.awarded){g.awarded=true;W.credits++;W.fish.wins++}blankMeal(g);g.target=g.waiting.find(o=>!o.departAt)?.id??null}})}
function drinkArt(d){return `<svg viewBox="0 0 90 105" aria-hidden="true"><path d="M20 18h50l-6 74q-19 10-38 0Z" fill="${d?'#dda63b':'#e6e9e4'}" stroke="#557467" stroke-width="3"/><path d="M55 30l9-27" stroke="#9f4740" stroke-width="4"/>${d?.ice?'<g fill="#def5f6" stroke="#9bcbd0" stroke-width="2"><rect x="29" y="37" width="17" height="17" rx="3" transform="rotate(10 37 45)"/><rect x="46" y="54" width="16" height="16" rx="3" transform="rotate(-12 53 62)"/></g>':''}<path d="M29 23h35" stroke="white" stroke-width="3" opacity=".7"/></svg>`}
function renderFish(){fishUpdate();const g=W.fish.current,a=allowance('fish'),live=g?.status==='playing';$('app').innerHTML=`<section class="panel fish-game restaurant ${live?'open-shop':''}"><div class="shop-sign"><span>MANAUS</span><b>大烤鱼 · PEIXE NA BRASA</b><small>炭火正旺 / GUARANÁ GELADO</small></div><div class="spread shopmeta"><span class="tag">60 秒 · 5 单达标</span><span class="quota">奖励机会 ${a.left} / 5</span></div>${!g?`<div class="welcome"><div class="fish-hero">${fishIcon('plate')}</div><h2>客人到了，开火吧。</h2><p>看订单 → 烤鱼 → 刷酱 / 配饮料<br>装入餐盒 → 做好了，打包上菜</p><button class="btn primary" id="startFish">${a.left?'开店 · 使用 1 次奖励机会':'自由营业 · 不发奖励'}</button></div>`:!live?`<div class="fish-end ${g.status==='won'?'success':''}" role="status"><h2>${g.status==='won'?'今日营业，达标！':'收摊啦，下次再战。'}</h2><p>合格出餐 ${g.served} / ${GOAL} 单 · 共交付 ${g.delivered} 单</p><p>接待 ${Math.min(MAX_GUESTS,g.nextId-1)} / ${MAX_GUESTS} 人 · 生气离开 ${g.angryLeft||0} 人</p><p>${g.awarded?'通关奖励 1 次抽奖已到账。':g.rewardEligible===false?'自由营业 · 本局不发奖励':''}</p><div class="actions">${g.awarded?'<button class="btn primary" id="fishDraw">去抽奖</button>':''}<button class="btn" id="startFish">${a.left?'再开一局':'自由营业 · 不发奖励'}</button></div></div>`:`<div class="shift-hud"><span>合格出餐 <b>${g.served} / ${GOAL}</b></span><strong id="fishClock">${Math.max(0,Math.ceil((g.deadline-Date.now())/1000))}s</strong><span>${g.awarded?'✦ 奖励已到账':g.rewardEligible===false?'自由营业 · 无奖励':'今日目标'}<b>${g.awarded?'继续营业':'5 单'}</b></span></div><div class="storefront"><span class="scene-label">01 / 客人 · 已进店 ${Math.min(MAX_GUESTS,g.nextId-1)} / ${MAX_GUESTS} 人 · 生气离开 ${g.angryLeft||0}</span><div class="guest-row">${g.waiting.map(o=>`<button class="guest ${o.angry?'angry-guest':''} ${o.id===g.target?'selected':''} ${o.departAt?'leaving':Date.now()-o.arrived<650?'entering':''}" data-customer="${o.id}" aria-pressed="${o.id===g.target}" ${o.departAt?'disabled':''}><div class="bubble"><b>${o.sauce?'要酱 · com molho':'无酱 · sem molho'}</b><strong>${o.ice?'com gelo 🧊':'sem gelo ☀'}</strong><small>${o.ice?'加冰':'无冰'} · 烤鱼＋瓜拉纳</small></div><div class="patience-meta"><span id="mood-${o.id}">${o.angry?'生气离开！':'耐心'}</span><span id="patience-seconds-${o.id}"></span></div><div class="patience-track" role="progressbar" aria-label="${GUESTS[o.kind][0]}的耐心" aria-valuemin="0" aria-valuemax="20" id="patience-meter-${o.id}"><i id="patience-fill-${o.id}"></i></div><div class="portrait" id="face-${o.id}" data-mood="${guestMood(o)}" role="img" aria-label="${['微笑','皱眉','不耐烦','生气'][guestMood(o)]}">${portrait(o.kind,guestMood(o))}${o.angry?'<span class="anger-icon" aria-label="生气">💢</span>':''}</div><span class="guest-name">${GUESTS[o.kind][0]} · #${o.id}${o.id===g.target?' ✓':''}</span></button>`).join('')}</div></div><div class="worktop"><span class="scene-label">02 / 料理台</span><div class="station-grid"><section class="station"><h3>炭火烤架</h3><div class="mini-grill ${g.stage==='plate'?'plated':''}">${fishIcon(g.stage==='plate'&&g.sauce?'plate':g.stage==='plate'?'ready':g.stage)}${g.stage==='cooking'?'<span class="fire">♨ ♨ ♨</span>':''}</div><div class="doneness-track compact-track" aria-label="熟度条，中间绿色为熟鱼区间"><i id="cookMarker"></i></div><div class="zone-labels"><span>生</span><span>熟</span><span>焦</span></div><div class="station-buttons">${g.stage==='raw'?'<button class="btn primary" data-fish="grill">放鱼上烤架</button>':g.stage==='cooking'?'<button class="btn primary" data-fish="plate">取下装盘</button>':g.stage==='plate'?`<button class="btn" data-fish="sauce" ${g.sauce>=2||g.packed?'disabled':''}>刷酱 ${g.sauce}/2</button>`:'<button class="btn" data-fish="discard">丢弃</button>'}${['plate','cooking'].includes(g.stage)?'<button class="btn tiny" data-fish="discard">丢弃重做</button>':''}</div></section><section class="station"><h3>瓜拉纳饮料台</h3><div class="drink-art">${drinkArt(g.drink)}</div><div class="cup-state">${g.drink?g.drink.ice?'com gelo · 加冰':'sem gelo · 无冰':'空杯'}</div><div class="station-buttons"><button class="btn" data-fish="drink" ${g.packed?'disabled':''}>倒饮料 / 换杯</button><button class="btn" data-fish="ice" ${!g.drink||g.packed?'disabled':''}>${g.drink?.ice?'换无冰':'加冰'}</button></div></section></div></div><section class="packing"><span class="scene-label">03 / 打包区 · 给 ${g.target?'#'+g.target:'下一位'} 客人</span><div class="meal-box ${g.packed?'sealed':''}">${g.packed?'<span class="bag-icon">▱</span><strong>餐盒已封好</strong>':`<span>${g.stage==='plate'?'烤鱼已装盘':'餐盘空位'}</span><span>＋</span><span>${g.drink?'饮料已备好':'饮料空位'}</span>`}</div>${g.packed?'<div class="pack-actions"><button class="btn primary" data-fish="serve">做好了，打包上菜 →</button><button class="btn" data-fish="unpack">打开餐盒</button></div>':`<button class="btn full" data-fish="pack" ${g.stage!=='plate'||!g.drink?'disabled':''}>装入餐盒</button>`}</section>`}${live&&g.fireAlert?`<div class="fire-modal" role="alertdialog" aria-modal="true" aria-label="烤架着火"><div class="fire-dialog"><svg class="fire-symbol" viewBox="0 0 100 120" aria-hidden="true"><path d="M53 4q9 35 27 49q30 28 8 53q-17 22-48 11Q-7 99 15 57q-3 28 15 25Q23 40 53 4" fill="#ef672b"/><path d="M52 50q3 24 18 35q14 24-10 30q-39 4-22-30q0 15 9 13q-8-26 5-48" fill="#ffe296"/></svg><button class="btn primary" data-fish="discard">丢掉重烤</button></div></div>`:''}<details class="rules"><summary>开店规则</summary><p>客人持续进店，同时接待两位，每局最多进店 15 人。每人耐心从 20 秒持续下降，耗尽会生气离开，且占用本局名额。15 人全部离开后提前结算。点客人选择交付对象，看清酱料与冰块要求。烤鱼约 1.6–2.4 秒处于绿色熟度区间，在此时取下；生鱼和焦鱼只能丢弃；鱼留在烤架上时，烤焦后进度继续，到终点弹出着火标志。</p><p>要酱刷两次，无酱不刷。饮料可在烤鱼期间准备。先装入餐盒，再点「做好了，打包上菜」完成交付；做错不会提示原因，只有符合订单的餐计入合格出餐。</p><p>60 秒内完成 5 单奖励一次抽奖，达标后可以继续营业到打烊。两个游戏各自有滚动 12 小时 5 次奖励挑战。失败后可重开；次数用完后仍可自由营业，但不发奖励。切换与刷新不暂停计时。</p></details></section>`;if($('startFish'))$('startFish').onclick=startFish;if($('fishDraw'))$('fishDraw').onclick=()=>switchMode('lottery');document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>selectCustomer(+b.dataset.customer));document.querySelectorAll('[data-fish]').forEach(b=>b.onclick=()=>fishAction(b.dataset.fish));updateFishUI()}
function updateFishUI(){const g=W.fish.current;if(g?.status!=='playing'||mode!=='fish')return;if($('fishClock')){const s=Math.max(0,Math.ceil((g.deadline-Date.now())/1000));$('fishClock').textContent=s+'s';$('fishClock').classList.toggle('urgent',s<=10)}for(const o of g.waiting){const face=$('face-'+o.id),m=guestMood(o);if(face&&face.dataset.mood!==String(m)){face.innerHTML=portrait(o.kind,m)+(o.angry?'<span class="anger-icon" aria-label="生气">💢</span>':'');face.dataset.mood=String(m);face.setAttribute('aria-label',['微笑','皱眉','不耐烦','生气'][m])}const left=o.angry?0:Math.max(0,PATIENCE_MS-(Date.now()-o.arrived)),ratio=left/PATIENCE_MS;const fill=$('patience-fill-'+o.id),label=$('patience-seconds-'+o.id),meter=$('patience-meter-'+o.id),mood=$('mood-'+o.id);if(fill){fill.style.width=(ratio*100)+'%';fill.style.background=ratio>.5?'#589967':ratio>.25?'#d49933':'#cf5041'}if(label)label.textContent=o.departAt?'':Math.ceil(left/1000)+'s';if(meter)meter.setAttribute('aria-valuenow',String(Math.ceil(left/1000)));if(mood)mood.textContent=o.angry?'生气离开！':o.departAt?'已取餐':ratio>.5?'耐心':ratio>.25?'有点着急':'快生气了';}if($('cookMarker'))$('cookMarker').style.left=Math.min(100,(g.onHeat?(Date.now()-g.cookAt)/COOK_MS:g.stopProgress||0)*100)+'%'}
setInterval(()=>{if(fishUpdate()){if(mode==='fish')renderFish()}else updateFishUI();if(mode==='fish'&&$('startFish'))$('startFish').disabled=false},50);

$('theme').onclick=()=>{const current=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=current==='dark'?'light':'dark'};
render();setInterval(updateWheel,60000);
</script></body></html>
