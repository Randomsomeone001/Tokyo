<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>十二星座决定你的专属行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#172131; --muted:#586477; --line:#D4DAE2;
  --machine:#1F2B45; --machine2:#2B3A5C; --screen:#C9F2D6; --screenInk:#0E3B22;
  --accent:#C8372D; --paper:#FFFFFF; --paperInk:#1B1B1B;
  --k1:#F2C230; --k2:#3BA776; --k3:#E86A92; --k4:#4C8BD6; --k5:#F08A3C; --k6:#8C6FD1; --k7:#2A9D9A;
  --shadow:0 2px 0 rgba(15,22,36,.18), 0 8px 24px rgba(15,22,36,.10);
  --disp:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141D; --surface:#182130; --ink:#E7ECF3; --muted:#9BA7B9; --line:#2A3649;
    --machine:#0A0F18; --machine2:#16213A; --screen:#0F3A24; --screenInk:#A9F0C2;
    --accent:#F0604F; --paper:#F4F2EC; --paperInk:#1B1B1B;
    --shadow:0 2px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#182130; --ink:#E7ECF3; --muted:#9BA7B9; --line:#2A3649;
  --machine:#0A0F18; --machine2:#16213A; --screen:#0F3A24; --screenInk:#A9F0C2;
  --accent:#F0604F; --paper:#F4F2EC; --paperInk:#1B1B1B;
  --shadow:0 2px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:grid;gap:18px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--k4);outline-offset:2px}

/* 机器头部 */
.machine{background:var(--machine);color:#EEF2F8;border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);display:grid;gap:14px}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:900;font-size:clamp(22px,5vw,30px);line-height:1.1;letter-spacing:.02em;text-wrap:balance}
.brand small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:#AFBBD0;letter-spacing:0;margin-top:6px}
.coin{font-family:var(--mono);font-size:12px;color:#AFBBD0;border:1px solid #3A4A6E;border-radius:999px;padding:4px 10px;white-space:nowrap}
.screen{background:var(--screen);color:var(--screenInk);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.screen b{font-weight:700}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:#34466B}
.steps i.on{background:var(--k1)}
.steps i.done{background:#7C8EB3}

/* 题目 */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.q h2{margin:0;font-size:19px;line-height:1.35;text-wrap:balance}
.q .hint{margin:-8px 0 0;color:var(--muted);font-size:13px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.key{position:relative;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 0 10px;overflow:hidden;box-shadow:0 2px 0 var(--line);transition:transform .08s ease, box-shadow .08s ease;min-height:92px;display:flex;flex-direction:column}
.key .band{height:8px;background:var(--kc,var(--k1))}
.key .kt{padding:8px 12px 0;font-weight:700;font-size:15px;line-height:1.3}
.key .kd{padding:3px 12px 0;color:var(--muted);font-size:12px;line-height:1.45}
.key .lamp{position:absolute;top:16px;right:10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:transparent}
.key[aria-pressed="true"]{border-color:var(--kc,var(--k1));box-shadow:0 0 0 2px var(--kc,var(--k1)) inset, 0 1px 0 var(--line);transform:translateY(1px)}
.key[aria-pressed="true"] .lamp{background:var(--kc,var(--k1));border-color:var(--kc,var(--k1));box-shadow:0 0 8px var(--kc,var(--k1))}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.nick input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:180px}

/* 签 */
.slipwrap{display:grid;gap:14px}
.slip{background:var(--paper);color:var(--paperInk);border-radius:6px;box-shadow:var(--shadow);padding:22px 20px 18px;position:relative;overflow:hidden;animation:out .7s cubic-bezier(.2,.8,.2,1)}
@keyframes out{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.slip{animation:none}}
.slip::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 26px)}
.fortune{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:6px}
.kichi{font-family:var(--disp);font-weight:900;font-size:44px;line-height:1;color:var(--accent);writing-mode:vertical-rl;letter-spacing:.1em;border:3px solid var(--accent);border-radius:6px;padding:10px 6px}
.persona{flex:1;min-width:200px}
.persona h3{margin:0;font-size:22px;line-height:1.3;text-wrap:balance}
.persona p{margin:6px 0 0;font-size:14px;color:#454545}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;border:1px solid #CFCFCF;border-radius:999px;padding:2px 9px;color:#333}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.sum div{border-top:2px solid #1B1B1B;padding-top:6px}
.sum b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:#555}
@media (max-width:480px){.sum{grid-template-columns:1fr 1fr}}
.days{display:grid;gap:12px;margin-top:16px}
.day{border-top:1px dashed #BDBDBD;padding-top:10px}
.day h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.day h4 .d{font-family:var(--mono);color:var(--accent)}
.day h4 small{font-weight:400;color:#666;font-size:12px}
.day ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.day li{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px;line-height:1.45}
.day li .t{font-family:var(--mono);font-size:12px;color:#666;padding-top:2px}
.day li .why{display:block;font-size:12px;color:#777}
.day li.meal .n::before{content:"食 ";color:var(--accent);font-weight:700}
.day li.bar .n::before{content:"酒 ";color:#4C5FA8;font-weight:700}
.stamp{position:absolute;right:14px;bottom:12px;font-family:var(--disp);font-weight:900;color:var(--accent);opacity:.18;font-size:64px;line-height:1;pointer-events:none}

.wheelbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;justify-items:center;text-align:center}
.wheelbox h3{margin:0;font-size:16px;justify-self:stretch;text-align:left}
.wheelbox .sub{margin:-6px 0 0;font-size:13px;color:var(--muted);justify-self:stretch;text-align:left}
.wheel{position:relative;width:min(300px,100%);aspect-ratio:1;max-width:100%}
.wheel canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:var(--shadow);transition:transform 3.2s cubic-bezier(.15,.85,.2,1)}
.wheel .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--accent);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.wheel .hub{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--machine);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:14px;border:3px solid #fff;z-index:2}
@media (prefers-reduced-motion: reduce){.wheel canvas{transition:none}}
.ticket{justify-self:stretch;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:var(--paper);color:var(--paperInk);border-radius:8px;padding:14px 16px;border:2px dashed var(--tc,var(--accent));box-shadow:var(--shadow)}
.ticket .tn{font-weight:800;font-size:18px;grid-column:1}
.ticket .no{font-family:var(--mono);font-size:12px;color:#666;grid-column:2;grid-row:1;align-self:center}
.ticket .ts{grid-column:1 / -1;font-size:14px}
.ticket .tv{grid-column:1 / -1;font-size:12px;color:#666;border-top:1px dotted #bbb;padding-top:6px;margin-top:4px}
.tickets{justify-self:stretch;display:grid;gap:10px}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.fb h3{margin:0;font-size:16px}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:44px;min-height:44px;font-family:var(--mono);font-weight:700}
.stars button[aria-pressed="true"]{background:var(--k1);border-color:var(--k1);color:#1B1B1B}
.fb textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:80px;width:100%;resize:vertical}
.note{font-size:13px;color:var(--muted)}
.ok{color:var(--k2);font-weight:600}

.crowd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.crowd h3{margin:0;font-size:16px}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:92px 1fr 32px;gap:8px;align-items:center;font-size:13px}
.barrow .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--k4)}
.barrow .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
footer{font-size:12px;color:var(--muted);text-align:center}
</style>

<div class="wrap">
  <section class="machine" aria-label="十二星座决定你的专属行程">
    <div class="mtop">
      <div class="brand">十二星座决定你的专属行程<small>10.8 → 10.13 · 两个人 · 选 6 张券，出一张你的东京签</small></div>
      <span class="coin" id="coin">¥0 投入</span>
    </div>
    <div class="screen" id="screen"><span>请选择：<b id="scrQ">出行强度</b></span><span id="scrN">券 1 / 6</span></div>

  </section>

  <section class="q" id="qbox" aria-live="polite"></section>

  <section class="slipwrap" id="result" hidden></section>



  <footer>行程数据来自「东京十月手帐」：每家店都按 Tabelog 百名店、米其林、50 Best 或 Google 高分挑过。会议时间（东京 20:00 以后）和已订的造型、航班不会被抽掉。</footer>
</div>

<script>
(function(){
"use strict";
/* ---------- 题目 ---------- */
const Q=[
 {id:"pace",title:"这趟想玩多累？",hint:"决定每天塞几站、几点出门。",multi:false,keys:[
   ["lazy","懒人慢游","每天 2–3 站，10:30 以后出门，逛累了就回酒店","--k2"],

   ["max","能多看就多看","每天 6 站以上，可选的景点全都去","--k5"]]},
 {id:"tier",title:"吃饭走哪条线？",hint:"品质线是米其林和 Tabelog 百名店；亲民线是本地人常去的高分老店。",multi:false,keys:[
   ["q","品质榜单","人均 ¥8,000–30,000（约 340–1,280 元），大多要订","--k3"],
   ["c","亲民老店","人均 ¥1,000–7,000（约 40–300 元），大多排队就能吃","--k2"],

 {id:"food",title:"最想吃哪些？",hint:"可以多选，最多 5 个；选中的会优先排进去。",multi:true,max:5,keys:[

   ["tonkatsu","炸猪排","とんかつ.jp / まい泉","--k5"],["izakaya","拉面 · 居酒屋","麺屋海神 / 三州屋 / たつや","--k3"]]},

   ["view","看塔 · 夜景","东京塔、稻村崎日落、31 楼大堂吧","--k4"]]},
 {id:"monday",title:"周一下午（巴西放假，整天都空）去哪？",hint:"上午都在上野，吃完鳗鱼再分开走。",multi:false,keys:[
   ["asakusa","浅草老东京","浅草寺、手艺老铺、合羽桥道具街，晚上寿喜烧","--k5"],
   ["nakameguro","中目黑 · 代官山","目黑川边的买手店、茑屋书店，晚上惠比寿烧肉","--k3"],
   ["auto","帮我选","按你前面选的口味和店来定","--k1"]]},
 {id:"night",title:"晚上不开会的那几晚怎么过？",hint:"周五、周六、周日、周一晚上都不开会。",multi:false,keys:[

];
const LABEL={}; Q.forEach(q=>q.keys.forEach(k=>LABEL[q.id+":"+k[0]]=k[1]));

/* ---------- 候选池 ----------
 kind: meal / bar / spot / fixed；tier: q / c；cat: 餐厅品类或店铺类型；opt: 可以被懒人模式省掉；pp: 人均日元 */
const DAYS=[
 {d:"10.8",wd:"周四",note:"落地打车到酒店，20:00 开会",latest:"19:00",slots:[

 {d:"10.9",wd:"周五",note:"12:00 后自由，晚上不开会",slots:[

   {t:"14:00",kind:"spot",cat:"dept",alsoCat:["designer"],opt:1,n:"伊势丹新宿 本馆",why:"3F 国际设计师，5F 日本器物"},
   {t:"15:30",kind:"spot",cat:"cafe",opt:1,n:"CAFE AALIYA",why:"Café 百名店，30 年的法式吐司"},
   {t:"16:10",fixed:"Alpen / L-Breath / mont-bell 买齐南极装备"},
   {t:"17:40",fixed:"打车回酒店放东西"},
   {t:"19:00",kind:"meal",meal:"D",pick:[
     {n:"六雁（银座怀石）",cat:"kaiseki",tier:"q",pp:33000,why:"以蔬菜为主角的现代江户怀石"},
     {n:"天ぷら あらたみかわ",cat:"tempura",tier:"q",pp:25000,why:"天妇罗百名店 2025，Tabelog 4.02"},
     {n:"大衆割烹 三州屋",cat:"izakaya",tier:"c",pp:3500,why:"1968 年的银座大众割烹"},

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderSteps(){
  $("steps").innerHTML=Q.map((q,i)=>`<i class="${i<S.step?"done":i===S.step?"on":""}"></i>`).join("");
  const q=Q[Math.min(S.step,Q.length-1)];
  $("scrQ").textContent=S.step>=Q.length?"出签完成":q.title.replace(/？$/,"");
  $("scrN").textContent=S.step>=Q.length?"券 6 / 6":`券 ${S.step+1} / ${Q.length}`;
  $("coin").textContent=`¥${(S.step*100).toLocaleString()} 投入`;
}
function isOn(q,k){ const v=S.a[q.id]; return q.multi?v.includes(k):v===k; }
function renderQ(){
  renderSteps();
  const q=Q[S.step]; const box=$("qbox");
  const ready=q.multi?S.a[q.id].length>0:!!S.a[q.id];
  box.innerHTML=`<h2>${esc(q.title)}</h2><p class="hint">${esc(q.hint)}${q.multi?` 已选 ${S.a[q.id].length} / ${q.max}`:""}</p>
   <div class="keys">${q.keys.map(k=>`<button type="button" class="key" style="--kc:var(${k[3]})" aria-pressed="${isOn(q,k[0])}" data-k="${k[0]}"><span class="band"></span><span class="lamp"></span><span class="kt">${esc(k[1])}</span><span class="kd">${esc(k[2])}</span></button>`).join("")}</div>
   <div class="nav"><button type="button" class="btn" id="back" ${S.step===0?"disabled":""}>上一张</button>
   <button type="button" class="btn go" id="next" ${ready?"":"disabled"}>${S.step===Q.length-1?"出签":"下一张"}</button></div>`;
  box.querySelectorAll(".key").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k;
    if(q.multi){ const arr=S.a[q.id]; const i=arr.indexOf(k); if(i>=0) arr.splice(i,1); else if(arr.length<q.max) arr.push(k); }
    else S.a[q.id]=k;
    renderQ(); const nb=$("qbox").querySelector(`[data-k="${k}"]`); if(nb) nb.focus();
  }));
  $("back").addEventListener("click",()=>{ if(S.step>0){S.step--;renderQ();} });
  $("next").addEventListener("click",()=>{ if(S.step<Q.length-1){S.step++;renderQ();} else draw(); });
}

/* ---------- 出签：打分挑店 ---------- */
let ROLLS=[];
function wantTier(meal,slot){ const t=S.a.tier;
  if(t==="dice"){ const r=1+Math.floor(Math.random()*6); ROLLS.push(r); slot._roll=r; return r%2?"c":"q"; }
  return t==="mix"?(meal==="L"?"c":"q"):t; }
function pickMeal(slot,used){
  let best=null,bs=-1e9; const want=wantTier(slot.meal,slot);
  slot.pick.forEach((c,i)=>{
    let s=0; if(used["n:"+c.n]) s-=100;
    if(S.a.food.includes(c.cat)) s+=4;
    if(c.tier===want) s+=(S.a.tier==="dice"?6:3);
    if(used[c.cat]) s-=3*used[c.cat];
    s-=i*0.1; /* 同分时用手帐里的默认顺序 */
    if(s>bs){bs=s;best=c;}
  });
  used[best.cat]=(used[best.cat]||0)+1; used["n:"+best.n]=1;
  return best;
}
function spotScore(sl){ const cats=[sl.cat].concat(sl.alsoCat||[]); return cats.filter(c=>S.a.shop.includes(c)).length; }
function buildDay(day,used){
  let slots=day.slots.slice();
  if(day.route){
    let r=S.a.monday;
    if(r==="auto"){ const na=["designer","books"].filter(c=>S.a.shop.includes(c)).length+(S.a.food.includes("wagyu")?1:0);
      const as=["craft","temple"].filter(c=>S.a.shop.includes(c)).length+(S.a.food.includes("sukiyaki")?1:0); r=na>as?"nakameguro":"asakusa"; }
    day.chosenRoute=r; slots=slots.concat(day.routes[r]);
  }
  const pace=S.a.pace, night=S.a.night;
  const cap=pace==="lazy"?2:pace==="mid"?4:99;
  const spots=slots.filter(s=>s.kind==="spot");
  const ranked=spots.map(s=>({s,sc:spotScore(s)+(s.opt?0:0.5)})).sort((a,b)=>b.sc-a.sc);
  const keepSpots=new Set();
  ranked.forEach(({s,sc},i)=>{ if(!s.opt||s.keep) keepSpots.add(s); else if(pace==="max") keepSpots.add(s); else if(keepSpots.size<cap&&(sc>0||pace==="mid")) keepSpots.add(s); });
  if(pace==="lazy") ranked.filter(x=>!x.s.opt).forEach(x=>keepSpots.add(x.s));
  const sideSc=k=>spots.filter(s=>s.side===k).reduce((a,s)=>a+spotScore(s),0);
  if(spots.some(s=>s.side)){ const lose=sideSc("B")>sideSc("A")?"A":"B"; spots.filter(s=>s.side===lose).forEach(s=>keepSpots.delete(s)); }
  const out=[]; let shift=0;
  const tm=t=>{ const [h,m]=t.split(":").map(Number); const v=h*60+m+shift; return Math.floor(v/60)+":"+String(v%60).padStart(2,"0"); };
  const late=t=>day.latest&&shift&&(()=>{ const [h,m]=t.split(":").map(Number), [lh,lm]=day.latest.split(":").map(Number); return h*60+m+shift>lh*60+lm; })();
  slots.forEach(s=>{
    if(s.fixed){ out.push({t:s.t,n:s.fixed,fixed:1}); return; }
    if(s.kind==="meal"){ const c=pickMeal(s,used); if(c.shift) shift=c.shift; out.push({t:c.t||s.t,n:c.n,why:(s._roll?`骰子掷出 ${s._roll} 点，吃${s._roll%2?"亲民":"品质"} · `:"")+c.why,meal:1,pp:c.pp,tier:c.tier,cat:c.cat}); return; }
    if(late(s.t)) return;
    const T=shift?tm(s.t):s.t;
    if(s.kind==="spot"){ if(keepSpots.has(s)) out.push({t:T,n:s.n,why:s.why,cats:[s.cat].concat(s.alsoCat||[])}); return; }
    if(s.kind==="bar"){
      if(s.keep){ out.push({t:T,n:s.n,why:s.why,bar:1}); return; }
      if(s.meeting){ if(night!=="early"&&S.a.shop.includes("view")) out.push({t:T,n:s.n,why:s.why+"（19:25 前要走）",bar:1}); return; }
      if(night==="early") return; if(s.second&&night!=="two") return;
      out.push({t:T,n:s.n,why:s.why,bar:1});
    }
  });
  return out;
}
function persona(){
  const p=S.a.pace, t=S.a.tier, f=S.a.food, sh=S.a.shop;
  const name={lazy:{q:"松弛贵妇",c:"巷子老饕",mix:"慢游美食家",dice:"随缘松弛派"},mid:{q:"精致城市漫步者",c:"东京生活家",mix:"会吃会逛的行家",dice:"命运美食家"},max:{q:"米其林特种兵",c:"暴走老饕",mix:"全能打卡王",dice:"赌神级吃货"}}[p][t];
  const lines=[];
  if(sh.includes("designer")) lines.push("衣柜会比来时满"); if(sh.includes("craft")) lines.push("会带回一把刻名的刀或一只杯子");
  if(sh.includes("view")) lines.push("相册里东京塔至少 30 张"); if(f.includes("wagyu")||f.includes("sukiyaki")) lines.push("和牛是这趟的主线");
  if(f.includes("sushi")) lines.push("久兵卫的吧台等你"); if(S.a.night==="two") lines.push("榜单酒吧一家不落");
  if(!lines.length) lines.push("按自己的节奏，舒服最重要");
  const LOTS=[["大吉",20,"天气晴好，稻村崎能看到富士山"],["吉",30,"想订的店都有位"],["中吉",30,"排队不超过 20 分钟"],["平吉",20,"慢慢逛，舒服最重要"]];
  let r=Math.random()*100, lot=LOTS[LOTS.length-1];
  for(const l of LOTS){ if(r<l[1]){ lot=l; break; } r-=l[1]; }
  const kichi=lot[0]; lines.unshift(lot[2]);
  return {name,lines,kichi};
}

    <label for="cmt" class="note">哪里想改？想加什么店？（可不填）</label>
    <textarea id="cmt" maxlength="500" placeholder="比如：周日想多逛一会儿器物店；烧肉可以换成涮涮锅"></textarea>
    <div class="nav"><button type="button" class="btn" id="again">重新抽一次</button><button type="button" class="btn go" id="send">提交打分</button></div>
    <p class="note" id="saveNote"></p></section>`;
  res.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  let rating=null;
  res.querySelectorAll("#stars button").forEach(b=>b.addEventListener("click",()=>{ rating=+b.dataset.r; res.querySelectorAll("#stars button").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.r===rating))); }));
  $("again").addEventListener("click",()=>{ S.step=0; S.a={pace:null,tier:null,food:[],shop:[],monday:null,night:null}; res.hidden=true; $("qbox").hidden=false; renderQ(); window.scrollTo({top:0}); });
  $("send").addEventListener("click",async()=>{
    const note=$("saveNote"); const comment=$("cmt").value.trim();
    if(!rating&&!comment){ note.textContent="先点一个分数，或者写一句想改的地方。"; return; }
    if(!API||!LAST.id){ note.textContent=API?"这一局还没存上，稍后再点一次提交。":"这是预览版，打分只会保存在公开网址上的游戏里。"; return; }
    $("send").disabled=true; note.textContent="正在提交……";
    try{ const r=await fetch("/api/feedback",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:LAST.id,rating,comment})});
      const j=await r.json(); if(!j.ok) throw new Error(j.error);
      note.innerHTML='<span class="ok">已提交，谢谢！</span> 你的选择和留言会帮下一版行程改得更好。';
    }catch(e){ $("send").disabled=false; note.textContent="没提交上，检查一下网络再点一次。"; }
  });
  save(); initWheel();
}
/* ---------- 大礼包转盘 ---------- */
const PRIZES=[
 ["请 J 人喝咖啡券","J人真棒！谢谢J人！"],
 ["新增会邀 ×1 券","Hello Chelsea，快速对一下"],
 ["合作方全部请假券","一觉醒来巴西公共假期增加 10000 倍"],
 ["P人续杯券","P人免费酒精一杯，谁是P人你别管"],
 ["谢谢惠顾","这个人很幸运，什么都没有抽到"],
 ["再转一次","手气不错，马上再转一次"],
 ["P人当导游券","P人真棒！谢谢P人！"],
 ["J人隐藏款","出示本券让J人现挂"]];
const AGAIN=5, COLORS=["--k1","--k4","--k2","--k6","--k5","--k3","--accent","--k7"], COOL_KEY="tokyoGiftUntil", DAY=24*3600*1000;
let ROT=0, SPUN=[], chain=0, busy=false, ORDER=[], REVEAL=-1, coolTimer=null;
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888"; }
function coolUntil(){ try{ return +localStorage.getItem(COOL_KEY)||0; }catch(e){ return 0; } }
function setCool(){ try{ localStorage.setItem(COOL_KEY,String(Date.now()+DAY)); }catch(e){} }
function coolLeft(){ return Math.max(0,coolUntil()-Date.now()); }
function drawWheel(){
  const cv=$("wheel"), x=cv.getContext("2d"), N=PRIZES.length, R0=300, seg=2*Math.PI/N;
  x.clearRect(0,0,600,600);
  ORDER.forEach((pi,i)=>{ const a0=-Math.PI/2+i*seg, a1=a0+seg;
    x.beginPath(); x.moveTo(R0,R0); x.arc(R0,R0,R0-4,a0,a1); x.closePath(); x.fillStyle=cssv(COLORS[i]); x.fill();
    x.strokeStyle="#ffffff"; x.lineWidth=4; x.stroke();
    x.save(); x.translate(R0,R0); x.rotate(a0+seg/2); x.textAlign="right"; x.textBaseline="middle";
    x.fillStyle="#ffffff"; x.font='700 30px -apple-system,"PingFang SC","Noto Sans SC",sans-serif';
    x.shadowColor="rgba(0,0,0,.35)"; x.shadowBlur=4; x.fillText(i===REVEAL?PRIZES[pi][0].replace(/券$/,""):"大礼包 "+(i+1),R0-30,0); x.restore(); });
  x.beginPath(); x.arc(R0,R0,R0-3,0,2*Math.PI); x.lineWidth=6; x.strokeStyle="#ffffff"; x.stroke();
}
function initWheel(){
  ROT=0; SPUN=[]; chain=0; busy=false; REVEAL=-1;
  ORDER=PRIZES.map((_,i)=>i).sort(()=>Math.random()-.5);
  drawWheel();
  const cv=$("wheel"); cv.style.transition="none"; cv.style.transform="rotate(0deg)"; void cv.offsetWidth; cv.style.transition="";
  $("tickets").innerHTML=""; $("spin").onclick=go; checkCool();
}
function checkCool(){
  clearInterval(coolTimer);
  const left=coolLeft(), btn=$("spin"), c=$("cool");
  if(!left){ btn.disabled=false; c.hidden=true; if(!busy) btn.textContent="转！"; return; }
  btn.disabled=true; btn.textContent="喜欢您再来"; c.hidden=false;
  const tickc=()=>{ const l=coolLeft(); if(!l){ clearInterval(coolTimer); checkCool(); return; }
    const h=Math.floor(l/3600000), m=Math.floor(l%3600000/60000); c.textContent=`每 24 小时能转一次，还要等 ${h} 小时 ${m} 分。`; };
  tickc(); coolTimer=setInterval(tickc,30000);
}
function roll(){ const N=PRIZES.length; let pi=Math.floor(Math.random()*N);
  if(pi===AGAIN&&chain>=2) pi=(pi+1+Math.floor(Math.random()*(N-1)))%N; return pi; }
const reduce=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(){
  if(busy||coolLeft()) return; busy=true; const pi=roll(); $("spin").disabled=true; $("spin").textContent="转动中……";
  const N=PRIZES.length, i=ORDER.indexOf(pi), deg=360/N, center=i*deg+deg/2, jitter=(Math.random()-.5)*deg*0.6;
  const cur=((ROT%360)+360)%360; ROT+=360*5+((360-center-jitter)-cur+720)%360;
  $("wheel").style.transform=`rotate(${ROT}deg)`;
  setTimeout(()=>{ REVEAL=i; drawWheel(); landed(pi); }, reduce()?50:3300);
}
function landed(pi){
  const p=PRIZES[pi]; const no="No."+String(1000+Math.floor(Math.random()*9000)); SPUN.push(p[0]);
  const col=COLORS[ORDER.indexOf(pi)];
  const t=document.createElement("div"); t.className="ticket"; t.style.setProperty("--tc",`var(${col})`);
  t.innerHTML=`<span class="tn">${esc(p[0])}</span><span class="no">${no}</span><span class="ts">${esc(p[1])}</span><span class="tv">${pi===AGAIN?"马上再转一次":"有效期 10.8–10.13 · 出示给对方即可兑现"}</span>`;
  $("tickets").prepend(t); busy=false;
  if(pi===AGAIN){ chain++; $("spin").textContent="再转一次"; setTimeout(go,900); return; }
  setCool(); saveSpins(); checkCool();
}
async function saveSpins(){
  if(LAST) LAST.spins=SPUN.slice();
  if(!API||!LAST||!LAST.id) return;
  try{ await fetch("/api/spin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:LAST.id,spins:SPUN})}); }catch(e){}
}
async function save(){
  const note=$("saveNote");
  if(!API){ note.textContent="这是预览版，不会保存记录；公开网址上的每一局都会记下来。"; return; }
  try{ const r=await fetch("/api/play",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(LAST)});
    const j=await r.json(); if(j.ok){ LAST.id=j.id; note.textContent="这一局已经记下来了。"; } else note.textContent="记录暂时没存上（后台还没设置好）。";
  }catch(e){ note.textContent="记录暂时没存上，不影响看签。"; }
}

renderQ();
})();
</script>
