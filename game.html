const GROUPS=['food','shop'], LABELS={food:'吃的心动榜',shop:'逛的心动榜'}, KEY='neonDichotomy.v2', WKEY='neonWheel.v2', DAY=86400000;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}
function payload(run=S){return {v:2,game:'neon-dichotomy',candidateVersion:'2026-09-29',runId:run.runId,tester:run.tester,createdAt:run.createdAt,answers:Object.fromEntries(GROUPS.map(g=>[g,run.groups[g].order.slice(0,6)])),duels:Object.fromEntries(GROUPS.map(g=>[g,run.groups[g].history])),rankings:Object.fromEntries(GROUPS.map(g=>[g,{all:run.groups[g].order,top6:run.groups[g].order.slice(0,6),confirmed:run.groups[g].confirmed,seed:suggestedOrder(g,run.groups[g].history)}])),rankingMethod:'pairwise-seed-user-confirmed',catalog:Object.fromEntries(GROUPS.map(g=>[g,CATALOG[g].map(c=>({id:c.id,name:c.name}))]))}}
const API=/^https?:$/.test(location.protocol);
async function post(path,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:controller.signal});let j;try{j=await r.json()}catch{throw Error('unavailable')}if(!r.ok||!j.ok)throw Error(j.error||'unavailable');return j}finally{clearTimeout(timer)}}
let saving=false;
async function saveResult(){if(saving||S.stage!=='result')return;const run=S,note=$('saveNote');if(!API){note.textContent='离线文件：可下载完整偏好结果；在线站点部署后可云端保存。';return}saving=true;$('retry').disabled=true;note.textContent='正在保存偏好……';try{if(!run.cloud){const j=await post('/api/play',payload(run));run.cloud=j.id;if(S===run)persist()}if(S===run){note.textContent='偏好已保存。';if(W.tickets.some(t=>t.runId===run.runId))await syncSpins(run)}}catch{if(S===run)note.textContent='云端暂未保存成功，偏好仍在当前浏览器。可重试或下载结果。'}finally{saving=false;if(S===run&&$('retry')){$('retry').disabled=false;$('retry').textContent=run.cloud?'同步奖券':'重试保存'}}}
function download(){const data={...payload(),cloudId:S.cloud,prizes:W.tickets.filter(t=>t.runId===S.runId)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='霓虹二分法-'+S.runId.slice(0,8)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const PRIZES=[['请 J 人喝咖啡券','J人真棒！谢谢J人！'],['新增会邀 ×1 券','Hello Chelsea，快速对一下'],['合作方全部请假券','一觉醒来巴西公共假期增加 10000 倍'],['P人续杯券','P人免费酒精一杯，谁是P人你别管'],['谢谢惠顾','这个人很幸运，什么都没有抽到'],['再转一次','手气不错，再来一局！'],['P人当导游券','P人真棒！谢谢P人！'],['J人隐藏款','出示本券让J人现挂']];
let W=read(WKEY,null);if(!W||!Array.isArray(W.tickets)||!Array.isArray(W.grants)||typeof W.clientId!=='string')W={clientId:uid(),until:Number(read('tokyoGiftUntil',0))||0,credits:0,grants:[],tickets:[],chain:0};write(WKEY,W);
let spinning=false,rotation=0;
const colors=['#c45345','#8c72b4','#378579','#cb9350','#476d93','#ab5d85','#638552','#82674e'];
function drawWheel(){const svg=$('wheel');if(!svg)return;svg.innerHTML=PRIZES.map((p,i)=>{const a=(i*45-90)*Math.PI/180,b=((i+1)*45-90)*Math.PI/180,x1=150+146*Math.cos(a),y1=150+146*Math.sin(a),x2=150+146*Math.cos(b),y2=150+146*Math.sin(b),mid=(a+b)/2,x=150+95*Math.cos(mid),y=150+95*Math.sin(mid);return `<path d="M150 150 L${x1} ${y1} A146 146 0 0 1 ${x2} ${y2} Z" fill="${colors[i]}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y}" fill="white" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="sans-serif" transform="rotate(${i*45+22.5} ${x} ${y})">礼物 ${i+1}</text>`}).join('');svg.style.transform=`rotate(${rotation}deg)`}
function updateWheel(){if(!$('spin'))return;const left=Math.max(0,W.until-Date.now());$('spin').disabled=spinning||(!W.credits&&left>0);$('spin').textContent=spinning?'幸运正在靠近……':W.credits?'使用额外机会 · '+W.credits:'转一下';$('cool').textContent=W.credits?`你还有 ${W.credits} 次额外机会。`:left?`本浏览器基础机会每24小时一次，还需 ${Math.ceil(left/3600000)} 小时。`:'今天的基础机会已就绪。';$('tickets').innerHTML=W.tickets.slice(-12).reverse().map(t=>`<div class="ticket"><strong>${esc(PRIZES[t.prize][0])}</strong><span>${esc(PRIZES[t.prize][1])}</span><br><small>${new Date(t.at).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo'})} · 东京时间</small></div>`).join('')}
function randomInt(n){const data=new Uint32Array(1),max=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(data)}while(data[0]>=max);return data[0]%n}
function spin(){if(spinning||(W.until>Date.now()&&!W.credits))return;spinning=true;if(W.credits>0)W.credits--;else{W.until=Date.now()+DAY;write('tokyoGiftUntil',W.until)}let prize=randomInt(8);if(prize===5&&W.chain>=2)prize=[0,1,2,3,4,6,7][randomInt(7)];if(prize===5){W.credits++;W.chain++}else W.chain=0;W.tickets.push({prize,at:new Date().toISOString(),runId:S.runId});W.tickets=W.tickets.slice(-60);write(WKEY,W);const target=360-(prize*45+22.5);rotation+=1440+((target-rotation%360+360)%360);const svg=$('wheel');if(svg)svg.style.transform=`rotate(${rotation}deg)`;const button=$('spin');button.disabled=true;button.textContent='幸运正在靠近……';const run=S;setTimeout(()=>{spinning=false;updateWheel();if(S===run&&run.cloud)syncSpins(run)},matchMedia('(prefers-reduced-motion: reduce)').matches?10:2900)}
async function syncSpins(run){try{await post('/api/spin',{id:run.cloud,spins:W.tickets.filter(t=>t.runId===run.runId).slice(-30).map(t=>PRIZES[t.prize][0])})}catch{if(S===run&&$('saveNote'))$('saveNote').textContent='偏好已保存；奖券云端同步失败，仍保留在本浏览器。可点“同步奖券”重试。'}}
async function redeem(e){e.preventDefault();const note=$('promoNote'),button=$('redeem'),input=$('promoInput');if(!API){note.textContent='兑换需要联网，在发布后的游戏网址中使用。';return}if(spinning){note.textContent='等转盘停下，再来兑换。';return}button.disabled=true;note.textContent='正在听你的答案……';try{const j=await post('/api/promo',{code:input.value,clientId:W.clientId});if(W.grants.includes(j.grant)){note.textContent='这份隐藏机会已经领过啦。';return}W.grants.push(j.grant);W.credits++;write(WKEY,W);input.value='';note.textContent='答对了！多给你一次心动的机会。';updateWheel()}catch(err){note.textContent=err.message==='wrong_code'?'还差一点，再想想你最喜爱的单曲。':err.message==='promo_unconfigured'?'隐藏加场还未开启，晚点再试。':'暂时没连上，检查网络后再试。'}finally{button.disabled=false}}
$('theme').onclick=()=>{const current=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=current==='dark'?'light':'dark'};
render();if(S.stage==='result'&&!S.cloud)saveResult();setInterval(updateWheel,60000);
</script></body></html>
